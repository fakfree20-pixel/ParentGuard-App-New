name: Build & Release Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses" 2>/dev/null || true
          cat << 'EOF' > "$ANDROID_HOME/licenses/android-sdk-license"
          89337d125679aa4727041753eab9c7936030784b
          24333f8a63b6825ea9c5514f83c2829b004d1fee
          d56f518547926e707e8178b773d06627041f3800
          EOF

          cat << 'EOF' > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          84831b9409646a918e30573bab4c9c91346d8abd
          EOF

          if [ -n "$ANDROID_SDK_ROOT" ] && [ "$ANDROID_SDK_ROOT" != "$ANDROID_HOME" ]; then
            mkdir -p "$ANDROID_SDK_ROOT/licenses" 2>/dev/null || true
            cp -r "$ANDROID_HOME/licenses"/* "$ANDROID_SDK_ROOT/licenses/" 2>/dev/null || true
          fi

      - name: Setup Environment & Keystores
        run: |
          # Create .env and secrets.properties
          touch .env
          echo "GEMINI_API_KEY=" >> .env
          if [ -f ".env.example" ]; then
            cat .env.example >> .env
          fi

          touch secrets.properties
          echo "GEMINI_API_KEY=" >> secrets.properties

          # Create local.properties with sdk.dir
          echo "sdk.dir=$ANDROID_HOME" > local.properties

          # Decode or generate debug.keystore
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || true
          fi
          if [ ! -s "debug.keystore" ]; then
            keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true
          fi

          # Generate release keystore
          keytool -genkeypair -v -keystore my-upload-key.jks -alias upload -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Release,O=Android,C=US" || true

          # Ensure app directory and root both have copies
          mkdir -p app
          cp debug.keystore app/debug.keystore 2>/dev/null || true
          cp my-upload-key.jks app/my-upload-key.jks 2>/dev/null || true

      - name: Build Android APK with Gradle
        env:
          STORE_PASSWORD: android
          KEY_PASSWORD: android
          KEY_ALIAS: upload
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug assembleRelease --stacktrace --no-daemon -Dorg.gradle.configuration-cache=false -Dksp.useKSP2=true -Dksp.incremental=false || ./gradlew assembleDebug --stacktrace --no-daemon -Dorg.gradle.configuration-cache=false -Dksp.useKSP2=true -Dksp.incremental=false

      - name: Prepare APK Outputs
        if: always()
        run: |
          mkdir -p build-apks
          find . -type f -name "*.apk" -exec cp -v {} build-apks/ \; 2>/dev/null || true
          echo "Collected APKs:"
          ls -la build-apks/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ParentGuard-APKs
          path: |
            build-apks/*.apk
            app/build/outputs/apk/**/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: build-apks/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}



