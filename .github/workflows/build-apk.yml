name: Build & Release Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          mkdir -p "$ANDROID_HOME/licenses" 2>/dev/null || true
          mkdir -p "$ANDROID_SDK_ROOT/licenses" 2>/dev/null || true
          for loc in "$ANDROID_HOME/licenses" "$ANDROID_SDK_ROOT/licenses"; do
            if [ -n "$loc" ]; then
              mkdir -p "$loc" 2>/dev/null || true
              printf "89337d125679aa4727041753eab9c7936030784b\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f518547926e707e8178b773d06627041f3800\n84831b9409646a918e30573bab4c9c91346d8abd\n" > "$loc/android-sdk-license" 2>/dev/null || true
              printf "84831b9409646a918e30573bab4c9c91346d8abd\n" > "$loc/android-sdk-preview-license" 2>/dev/null || true
              printf "601085b94cd77f0b54ff864069570991500085d7\n" > "$loc/android-googletv-license" 2>/dev/null || true
              printf "33b6a2b64920400829152f90dddd4d8666f65157\n" > "$loc/google-gdk-license" 2>/dev/null || true
              printf "e9acab5b5fbb560a725114e6de8b07049d715d3d\n" > "$loc/mips-android-sysimage-license" 2>/dev/null || true
            fi
          done

      - name: Setup Android Environment & Keystores
        run: |
          # 1. Ensure .env and secrets.properties exist
          touch .env
          echo "GEMINI_API_KEY=" > .env
          if [ -f ".env.example" ]; then
            cat .env.example >> .env
          fi

          touch secrets.properties
          echo "GEMINI_API_KEY=" > secrets.properties

          # 2. Setup debug keystore
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || base64 --decode debug.keystore.base64 > debug.keystore 2>/dev/null || true
          fi
          if [ ! -s "debug.keystore" ]; then
            keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" 2>/dev/null || true
          fi

          # 3. Setup upload release keystore
          keytool -genkeypair -v -keystore my-upload-key.jks -alias upload -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Release,O=Android,C=US" 2>/dev/null || true

          # 4. Mirror keystores to app folder
          mkdir -p app
          cp -f debug.keystore app/debug.keystore 2>/dev/null || true
          cp -f my-upload-key.jks app/my-upload-key.jks 2>/dev/null || true

          # 5. Make gradlew executable
          chmod +x ./gradlew

      - name: Build Android APK
        env:
          STORE_PASSWORD: android
          KEY_PASSWORD: android
          KEY_ALIAS: upload
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect APKs
        if: always()
        run: |
          mkdir -p build-apks
          # Find all APK files and copy to build-apks
          find . -name "*.apk" -not -path "*/build-apks/*" | while read -r apk; do
            echo "Found APK: $apk"
            cp -v "$apk" build-apks/
          done
          
          # Provide standard names
          if [ -f build-apks/app-debug.apk ]; then
            cp -v build-apks/app-debug.apk build-apks/ParentGuard-debug.apk || true
          fi
          if [ -f build-apks/app-release.apk ]; then
            cp -v build-apks/app-release.apk build-apks/ParentGuard-release.apk || true
          fi
          if [ -f build-apks/app-release-unsigned.apk ]; then
            cp -v build-apks/app-release-unsigned.apk build-apks/ParentGuard-release-unsigned.apk || true
          fi
          
          echo "=== Collected APKs in build-apks ==="
          ls -la build-apks/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ParentGuard-APKs
          path: build-apks/*
          retention-days: 30
          if-no-files-found: warn

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build-apks/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

