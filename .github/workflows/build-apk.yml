name: Build & Release Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare Secrets & Environment
        run: |
          touch .env
          echo "GEMINI_API_KEY=" > .env
          if [ -f ".env.example" ]; then
            cat .env.example >> .env
          fi

          touch secrets.properties
          echo "GEMINI_API_KEY=" > secrets.properties

          touch local.defaults.properties
          echo "GEMINI_API_KEY=" > local.defaults.properties

          # Setup Debug Keystore
          if [ -f "debug.keystore.base64" ]; then
            (base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null) || (base64 --decode debug.keystore.base64 > debug.keystore 2>/dev/null) || true
          fi
          if [ ! -s "debug.keystore" ]; then
            keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" 2>/dev/null || true
          fi

          # Setup Upload Keystore
          if [ ! -s "my-upload-key.jks" ]; then
            keytool -genkeypair -v -keystore my-upload-key.jks -alias upload -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Release,O=Android,C=US" 2>/dev/null || true
          fi

          # Ensure app subdirectory also has copies
          mkdir -p app
          cp -f debug.keystore app/debug.keystore 2>/dev/null || true
          cp -f my-upload-key.jks app/my-upload-key.jks 2>/dev/null || true

          # Ensure gradlew is executable
          chmod +x ./gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Build Android APK
        env:
          STORE_PASSWORD: android
          KEY_PASSWORD: android
          KEY_ALIAS: upload
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Collect APK Outputs
        if: always()
        run: |
          mkdir -p build-apks
          # Find all APK files from app outputs
          find app/build/outputs/apk/ -name "*.apk" -type f -exec cp -v {} build-apks/ \; 2>/dev/null || true
          find . -name "*.apk" -not -path "*/build-apks/*" -type f -exec cp -v {} build-apks/ \; 2>/dev/null || true

          # Standardized alias
          if [ -f build-apks/app-debug.apk ]; then
            cp -v build-apks/app-debug.apk build-apks/ParentGuard-debug.apk || true
          fi

          echo "=== Collected APKs in build-apks ==="
          ls -la build-apks/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ParentGuard-APKs
          path: build-apks/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build-apks/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

